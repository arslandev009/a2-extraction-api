[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2-extraction"
version = "0.1.0"
description = "A2: PDF invoice extraction API (pdfplumber -> LLM structured output -> validators -> review flag)"
requires-python = ">=3.12"
# llm-client (packages/llm-client) is installed separately (editable) and imported lazily.
dependencies = [
  "pydantic>=2",
  "pdfplumber>=0.10",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "E731", "E741", "B905"]
